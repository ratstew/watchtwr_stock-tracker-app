<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 32" width="140" height="32" fill="none">
  <title>watchtwr</title>
  <!-- Tower icon -->
  <g>
    <!-- beam -->
    <path d="M16 6 L3 1 M16 6 L29 1" stroke="#FDD458" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <!-- lamp -->
    <circle cx="16" cy="6" r="3" fill="#FDD458"/>
    <!-- platform -->
    <rect x="9" y="9" width="14" height="3.5" rx="1" fill="#E5E7EB"/>
    <!-- body -->
    <path d="M11.5 12.5 H20.5 L22.5 31 H9.5 Z" fill="#E5E7EB"/>
    <!-- window as rising chart line -->
    <path d="M12.5 26 L15 22 L17 24 L20 18" stroke="#0F1115" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="38" y="23" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="0.5" fill="#E5E7EB">watch<tspan fill="#FDD458">twr</tspan></text>
</svg>
